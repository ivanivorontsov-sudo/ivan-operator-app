<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Анкета</title></head><body>
<h1>Анкета участника</h1>
<form method="post" action="/basic" enctype="multipart/form-data">
<p><label for="name">Имя</label> <input id="name" name="name" required></p>
<p><label for="email">Email</label> <input id="email" name="email" type="email" required></p>
<p><label for="phone">Телефон</label> <input id="phone" name="phone" type="tel" placeholder="+7 900 000-00-00" required></p>
<p><label for="about">О себе</label><br><textarea id="about" name="about" rows="4" cols="50"></textarea></p>
<p><label for="city">Город</label> <select id="city" name="city"><option value="">— выберите —</option><option value="msk">Москва</option><option value="vvo">Владивосток</option><option value="nsk">Новосибирск</option></select></p>
<p>Размер: <input type="radio" id="s_s" name="size" value="S"><label for="s_s">Маленький</label>
<input type="radio" id="s_m" name="size" value="M"><label for="s_m">Средний</label>
<input type="radio" id="s_l" name="size" value="L"><label for="s_l">Большой</label></p>
<p><input type="checkbox" id="news" name="news" value="yes"><label for="news">Подписаться на новости</label>
<input type="checkbox" id="terms" name="terms" value="yes"><label for="terms">Согласен с правилами</label></p>
<p><label for="date">Дата визита</label> <input id="date" name="date" type="date"></p>
<p><label for="file">Файл</label> <input id="file" name="file" type="file"></p>
<button type="submit">Отправить</button>
</form></body></html>
